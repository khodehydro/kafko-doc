<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#00A94F">
<title>Kafko — Learn languages with music</title>

<link rel="preload" href="assets/fonts/plus-jakarta-sans.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="assets/artists/art-1.jpg" as="image">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="stage">
  <div class="device">
    <span class="device__btn device__btn--vol" aria-hidden="true"></span>
    <span class="device__btn device__btn--pwr" aria-hidden="true"></span>

    <div class="screen">
      <div class="screen__glow" aria-hidden="true"></div>

      <!-- ============================= status bar ============================= -->
      <div class="statusbar" aria-hidden="true">
        <span class="statusbar__time">9:41</span>
        <span class="statusbar__icons">
          <svg viewBox="0 0 18 12"><rect x="0"  y="7.4" width="3" height="4.6" rx="1.2"/><rect x="4.4" y="5.3" width="3" height="6.7" rx="1.2"/><rect x="8.8" y="3" width="3" height="9" rx="1.2"/><rect x="13.2" y="0.6" width="3" height="11.4" rx="1.2"/></svg>
          <svg viewBox="0 0 17 12"><g fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M1.2 4.4a10.4 10.4 0 0 1 14.6 0"/><path d="M4 7.1a6.4 6.4 0 0 1 9 0"/></g><circle cx="8.5" cy="10.2" r="1.7"/></svg>
          <svg viewBox="0 0 26 12"><rect x="0.7" y="1" width="21" height="10" rx="3.2" fill="none" stroke="currentColor" stroke-width="1.2" opacity=".4"/><rect x="2.6" y="2.9" width="14.4" height="6.2" rx="2"/><path d="M23.6 4.2v3.6a2 2 0 0 0 0-3.6z" opacity=".4"/></svg>
        </span>
      </div>

      <!-- ============================== content =============================== -->
      <main class="scroll" id="scroll">

        <!-- app bar -->
        <header class="appbar frost" id="appbar">
          <div class="brand">
            <span class="brand__mark" aria-hidden="true">
              <svg viewBox="0 0 24 24"><path d="M9.2 17.6V6.4l10.2-2.1" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/><circle cx="6.4" cy="17.7" r="2.8"/><circle cx="16.6" cy="15.6" r="2.8"/></svg>
            </span>
            <span class="brand__text">
              <span class="brand__name">Kafko</span>
              <span class="brand__tag">Learn languages with music</span>
            </span>
          </div>
        </header>

        <!-- artists -->
        <section class="stories" aria-label="Artists">
          <div class="stories__track" id="storyTrack" tabindex="0"></div>
        </section>

        <!-- language filter -->
        <section class="filters frost" id="filtersBar" aria-label="Filter by language">
          <div class="filters__track" id="filters" role="tablist"></div>
        </section>

        <!-- songs -->
        <section class="songs" aria-label="Songs">
          <div class="songs__head">
            <h2 class="songs__title" id="songsTitle">All songs</h2>
            <span class="songs__count" id="songsCount"></span>
            <button class="songs__reset" id="resetFilter" type="button" hidden>
              Clear
              <svg viewBox="0 0 24 24"><path d="M7.5 7.5l9 9m0-9l-9 9" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
            </button>
          </div>
          <ul class="songs__list" id="songList"></ul>
        </section>

      </main>

      <!-- =============================== dock ================================ -->
      <nav class="dock" id="dock" aria-label="Main navigation">
        <span class="dock__pill" id="dockPill" aria-hidden="true"></span>

        <button class="dock__item is-active" type="button" data-tab="home" aria-current="page">
          <svg viewBox="0 0 24 24"><path d="M3.6 10.7 12 4l8.4 6.7V19a1.6 1.6 0 0 1-1.6 1.6H5.2A1.6 1.6 0 0 1 3.6 19z" fill="none" stroke="currentColor" stroke-width="1.95" stroke-linecap="round" stroke-linejoin="round"/><path d="M9.7 20.5v-5.4h4.6v5.4" fill="none" stroke="currentColor" stroke-width="1.95" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span>Home</span>
        </button>

        <button class="dock__item" type="button" data-tab="leitner">
          <svg viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.95" stroke-linecap="round" stroke-linejoin="round"><rect x="3.7" y="9.6" width="16.6" height="10.2" rx="3.1"/><path d="M7.2 6.4h9.6M8.6 3.4h6.8" /></g></svg>
          <span>Leitner</span>
        </button>

        <button class="dock__item" type="button" data-tab="profile">
          <svg viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.95" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8.3" r="3.7"/><path d="M4.9 20.3c1.3-3.5 4-5.4 7.1-5.4s5.8 1.9 7.1 5.4"/></g></svg>
          <span>Profile</span>
        </button>
      </nav>

      <div class="toast" id="toast" role="status" aria-live="polite"></div>
    </div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
